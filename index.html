<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sqorz Head to Head</title>
<script>
  (() => {
    const saved = localStorage.getItem('theme');
    const isDark = saved === 'dark' ||
      (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.classList.toggle('dark', isDark);
    if (saved) document.documentElement.dataset.themePref = saved;
  })();
</script>
<style>
  :root{
    /* Palette pastel — ancrée sur un bleu acier (#6a8caf) */
    --bg:#f1f4f8;
    --bg-overlay:linear-gradient(180deg, rgba(106,140,175,.55) 0%, rgba(106,140,175,.30) 100%);
    --card:#ffffff; --card-soft:#f7fafc;
    --ink:#2c3845; --ink-2:#4a5868; --muted:#6a7886;
    --line:#e4ebf1; --line-strong:#cdd6e0;
    --accent:#6a8caf;        /* bleu acier principal */
    --accent-vivid:#4a7ab5;
    --accent-hi:#506f8f;
    --accent-soft:#dde6ef;
    --accent-ink:#fff;
    /* Famille pastel élargie — un cran plus saturé pour rester lisible sur fond clair */
    --rose:#f0a8c2;
    --coral:#f4a89a;
    --peach:#f5c0a0;
    --apricot:#f5d4a0;
    --butter:#f0d878;
    --lime:#cfdf8c;
    --mint:#a8dcc4;
    --teal:#88ccd0;
    --sky:#a8c8e8;
    --blueberry:#a8b4e0;
    --lilac:#bdacd9;
    --lavender:#d0b6e0;
    --berry:#e09bc2;
    --grape:#c594d4;
    /* Sémantiques + médailles, en pastel */
    --good:#a8dcc4;
    --bad:#f5a8a8;
    --warn:#f5d294;
    --gold:#e8c574;
    --silver:#cdd2dc;
    --bronze:#d4a07c;
    --shadow:0 1px 2px rgba(60,90,120,.10), 0 10px 28px rgba(60,90,120,.14);
    --shadow-xl:0 2px 8px rgba(60,90,120,.16), 0 24px 56px rgba(60,90,120,.22);
    --radius:16px;
  }
  :root.dark{
    --bg:#1f262e; --card:#2a3340; --card-soft:#252e3a;
    --ink:#e4ebf2; --ink-2:#c2ccd8; --muted:#a4afbb;
    --line:#3a4250; --line-strong:#4d5666;
    --accent:#9bb5cf; --accent-hi:#b6cce0; --accent-soft:#3a4250;
    --rose:#f4b8cb; --coral:#f4b4a4; --peach:#f5cdac; --apricot:#f5dab0;
    --butter:#efdc8c; --lime:#d8e8a0; --mint:#b4e0c8; --teal:#a4d8d8;
    --sky:#b6d2eb; --blueberry:#b8c5e8; --lilac:#c8b8df; --lavender:#d6bce6;
    --berry:#e8a8c8; --grape:#cca4dc;
    --good:#b4e0c8; --bad:#f5b0b0; --warn:#f5d8a4;
    --gold:#eccc88; --silver:#d4d8e0; --bronze:#d8a888;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 28px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box}
  html,body{margin:0; padding:0}

  /* Focus clavier accessible — visible uniquement sur navigation Tab, pas au clic souris */
  :focus{outline:none}
  :focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
    border-radius:6px;
  }
  .btn:focus-visible,
  .recent-chip:focus-visible,
  .recent-clear:focus-visible,
  .section-toggle:focus-visible{
    outline:2px solid var(--accent-hi);
    outline-offset:3px;
  }
  /* Les inputs gardent leur propre style de focus (border + box-shadow) */
  .control:focus-visible{outline:none}
  .topbar :focus-visible{outline-color:#fff}
  body{
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink); background:var(--bg);
    -webkit-font-smoothing:antialiased;
  }
  .topbar{
    position:relative; overflow:hidden; z-index:1;
    color:#fff; padding:48px 24px 128px;
    background:linear-gradient(135deg, #2e4158 0%, #3f566f 35%, #6a8caf 70%, #8aa6c2 100%);
    transition:padding .25s ease, min-height .25s ease;
  }
  .topbar::after{
    /* lueur douce en haut */
    content:""; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(circle at 80% 0%, rgba(255,255,255,.22), transparent 55%),
               radial-gradient(circle at 10% 100%, rgba(30,50,80,.35), transparent 45%);
  }
  .topbar-inner{
    max-width:1180px; margin:0 auto; position:relative; z-index:1;
  }
  .brand-row{display:flex; align-items:center; justify-content:space-between; gap:12px}
  .brand{display:flex; align-items:center; gap:12px; font-weight:600; letter-spacing:.2px; color:#fff}

  body.has-results .topbar .brand-row{
    width:100%; margin:0;
  }
  .theme-btn{
    display:inline-flex; align-items:center; justify-content:center;
    width:36px; height:36px; padding:0;
    background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.22);
    color:#fff; border-radius:10px;
    cursor:pointer; font-size:18px; line-height:1;
    transition:background .15s, border-color .15s, transform .15s;
  }
  .theme-btn:hover{background:rgba(255,255,255,.2); border-color:rgba(255,255,255,.4)}
  .theme-btn:active{transform:scale(.95)}
  .brand .logo{
    width:40px; height:40px; border-radius:12px;
    background:rgba(255,255,255,.22); color:#fff;
    display:grid; place-items:center; font-weight:800; font-size:14px;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.45);
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  }
  .topbar h1{margin:24px 0 8px; font-size:34px; font-weight:800; letter-spacing:-1px; color:#fff; text-shadow:0 2px 14px rgba(20,35,60,.45)}
  .topbar p{margin:0; font-size:15px; max-width:min(600px,100%); color:#dce8f2; text-shadow:0 1px 6px rgba(20,35,60,.35); line-height:1.5}

  main{max-width:1180px; margin:-80px auto 40px; padding:0 24px 32px; position:relative; z-index:10;}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px; box-shadow:var(--shadow); margin-bottom:18px;
  }
  .filters{padding:20px}
  .grid{display:grid; gap:14px}
  .filters .grid{grid-template-columns:repeat(12,1fr)}
  .field{display:flex; flex-direction:column; min-width:0}
  .field.col-name{grid-column:span 10}
  .field.col-btn{grid-column:span 2; align-items:stretch}
  @media (max-width:880px){
    .field.col-name,.field.col-btn{grid-column:span 12}
  }

  /* Skeleton loaders */
  .skeleton{
    background:linear-gradient(90deg,
      var(--card-soft) 0%,
      color-mix(in srgb, var(--line) 80%, var(--card-soft)) 50%,
      var(--card-soft) 100%);
    background-size:200% 100%;
    animation:shimmer 1.4s infinite linear;
    border-radius:6px;
  }
  @keyframes shimmer{
    0%{background-position:200% 0}
    100%{background-position:-200% 0}
  }
  .skeleton-card{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:16px 18px; box-shadow:var(--shadow);
  }
  .skeleton-line{height:14px; margin-bottom:8px; width:100%}
  .skeleton-line.h1{height:24px; width:60%; margin-bottom:14px}
  .skeleton-line.h2{height:34px; width:45%; margin-bottom:10px}
  .skeleton-line.sm{height:11px; width:80%}
  .skeleton-card:last-child .skeleton-line:last-child{margin-bottom:0}

  /* Recherches récentes */
  .recent-row{
    margin-top:14px; padding-top:14px; border-top:1px dashed var(--line);
    display:flex; gap:8px; flex-wrap:wrap; align-items:center;
  }
  .recent-row[hidden]{display:none}
  .recent-label{
    font-size:11px; font-weight:600; color:var(--muted);
    text-transform:uppercase; letter-spacing:.5px; flex-shrink:0;
  }
  .recent-chip{
    font:inherit; cursor:pointer; padding:5px 12px; border-radius:99px;
    background:var(--card-soft); border:1px solid var(--line);
    color:var(--ink); font-size:12.5px; display:inline-flex; gap:6px; align-items:baseline;
    transition:border-color .15s, background .15s;
  }
  .recent-chip:hover{
    border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 10%, transparent);
  }
  .recent-chip .recent-meta{
    color:var(--muted); font-size:11px; font-weight:400;
  }
  .recent-clear{
    margin-left:auto; background:none; border:none; color:var(--muted); cursor:pointer;
    font-size:12px; padding:4px 8px; border-radius:6px;
  }
  .recent-clear:hover{color:var(--bad); background:color-mix(in srgb,var(--bad) 10%, transparent)}

  /* Results filter bar */
  .results-filters{padding:14px 18px; display:flex; gap:18px; flex-wrap:wrap; align-items:flex-end}
  .results-filters .field{flex:1 1 180px; max-width:260px}
  .results-filters .summary-info{
    flex:1 1 100%; font-size:12px; color:var(--muted);
    border-top:1px solid var(--line); padding-top:10px; margin-top:2px;
  }
  @media (max-width:640px){
    .results-filters .field{max-width:none}
  }
  label{font-size:11px; font-weight:600; color:var(--muted); margin-bottom:6px; text-transform:uppercase; letter-spacing:.5px}
  .control{
    font:inherit; padding:10px 12px; border:1px solid var(--line);
    border-radius:9px; background:var(--card); color:var(--ink);
    transition:border-color .15s, box-shadow .15s, background .15s;
  }
  .control:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%, transparent)}
  .control:disabled{background:var(--card-soft); color:var(--muted); cursor:not-allowed}
  select.control,input.control{width:100%}
  .btn{
    font:inherit; font-weight:600; padding:11px 18px; border:none; border-radius:9px;
    background:var(--accent); color:var(--accent-ink); cursor:pointer;
    transition:background .15s, transform .05s;
  }
  .btn:hover:not(:disabled){background:var(--accent-hi)}
  .btn:active:not(:disabled){transform:translateY(1px)}
  .btn:disabled{background:var(--line-strong); color:var(--card); cursor:not-allowed}
  .btn.btn-danger{background:var(--bad)}
  .btn.btn-danger:hover:not(:disabled){background:color-mix(in srgb, var(--bad) 80%, black)}
  .btn-ghost{background:transparent; color:var(--accent); padding:4px 6px; font-size:12px}
  .btn-ghost:hover:not(:disabled){background:color-mix(in srgb,var(--accent) 10%, transparent)}
  .hint{font-size:12px; color:var(--muted); margin-top:6px}
  .status{font-size:13px; color:var(--muted); margin-top:14px; min-height:18px}
  .status.error{color:var(--bad)}
  .status.loading{font-size:15px; color:var(--accent); font-weight:600; display:flex; align-items:center; gap:8px}
  .status.loading::before{content:''; display:inline-block; width:16px; height:16px; border:2px solid color-mix(in srgb,var(--accent) 30%,transparent); border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite; flex-shrink:0}
  @keyframes spin{to{transform:rotate(360deg)}}
  .progress{
    height:6px; background:var(--card-soft); border:1px solid var(--line);
    border-radius:99px; overflow:hidden; margin-top:10px;
  }
  .progress > div{
    height:100%; width:0; transition:width .2s;
    background:linear-gradient(90deg,var(--teal),var(--sky),var(--lavender));
  }

  /* Stats */
  .stats-hero{
    display:grid; gap:14px; margin-bottom:16px;
    grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));
  }
  .stats-detail{display:flex; flex-direction:column; gap:16px; margin-bottom:20px}
  .stat-group{display:flex; flex-direction:column; gap:8px}
  .stat-group-title{
    font-size:11px; font-weight:600; color:var(--muted);
    text-transform:uppercase; letter-spacing:.6px;
  }
  .stat.stat-hero{padding:18px 20px}
  .stat.stat-hero .k{font-size:12px}
  .stat.stat-hero .v{font-size:34px}
  .stat.stat-hero .sub{font-size:12.5px}
  .stat[title]{cursor:help}

  .stats{display:grid; grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); gap:12px; margin-bottom:0}
  .stat{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:14px 16px; box-shadow:var(--shadow); position:relative; overflow:hidden;
  }
  .stat::before{
    content:""; position:absolute; left:0; top:0; bottom:0; width:4px;
    background:var(--stat-color, var(--accent)); opacity:.85;
  }
  .stat::after{
    /* lavis très léger pour suggérer la teinte sans saturer */
    content:""; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(135deg,
      color-mix(in srgb, var(--stat-color, var(--accent)) 7%, transparent),
      transparent 55%);
  }
  .stat.gold      { --stat-color: var(--gold) }
  .stat.silver    { --stat-color: var(--silver) }
  .stat.bronze    { --stat-color: var(--bronze) }
  .stat.good      { --stat-color: var(--mint) }
  .stat.mint      { --stat-color: var(--mint) }
  .stat.peach     { --stat-color: var(--peach) }
  .stat.apricot   { --stat-color: var(--apricot) }
  .stat.butter    { --stat-color: var(--butter) }
  .stat.lime      { --stat-color: var(--lime) }
  .stat.teal      { --stat-color: var(--teal) }
  .stat.sky       { --stat-color: var(--sky) }
  .stat.blueberry { --stat-color: var(--blueberry) }
  .stat.lav       { --stat-color: var(--lavender) }
  .stat.lilac     { --stat-color: var(--lilac) }
  .stat.lavender  { --stat-color: var(--lavender) }
  .stat.berry     { --stat-color: var(--berry) }
  .stat.rose      { --stat-color: var(--rose) }
  .stat.coral     { --stat-color: var(--coral) }
  .stat.grape     { --stat-color: var(--grape) }
  .stat.sage      { --stat-color: var(--good) }
  .stat .k{font-size:11px; color:var(--muted); text-transform:uppercase; font-weight:600; letter-spacing:.5px; position:relative}
  .stat .v{
    font-size:24px; font-weight:700; margin-top:2px; line-height:1.1; position:relative;
    color:var(--ink);
  }
  .stat .sub{font-size:12px; color:var(--muted); margin-top:2px; position:relative}

  /* Graphiques (SVG natif) */
  .charts-grid{
    display:grid; gap:14px; margin-bottom:20px;
    grid-template-columns:repeat(auto-fit, minmax(340px, 1fr));
  }
  .chart-card{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:16px 18px; box-shadow:var(--shadow);
  }
  .chart-card.chart-full{grid-column:1 / -1}
  .chart-title{font-weight:600; font-size:14px; color:var(--ink); margin-bottom:2px}
  .chart-sub{font-size:11px; color:var(--muted); margin-bottom:10px; text-transform:uppercase; letter-spacing:.5px}
  .chart{width:100%; height:auto; display:block; font-family:inherit}
  .chart .grid{stroke:var(--line-strong); stroke-width:1; opacity:.6}
  .chart .axis{stroke:var(--ink-2); stroke-width:1.25}
  .chart .axis-label{font-size:13px; fill:var(--ink-2); font-weight:500}
  .chart .axis-label.muted{fill:var(--muted); font-weight:400}
  .chart .zone{opacity:.35}
  .chart .line{fill:none; stroke:var(--accent); stroke-width:2.5; stroke-linejoin:round; stroke-linecap:round}
  .chart .line-mean{fill:none; stroke:var(--accent-hi); stroke-width:1.5; stroke-dasharray:4 4; opacity:.7}
  .chart .area{fill:color-mix(in srgb,var(--accent) 18%, transparent); stroke:none}
  .chart .point{fill:var(--card); stroke:var(--accent); stroke-width:2; transition:r .15s, stroke-width .15s}
  .chart .point:hover{r:6; stroke-width:2.5}
  .chart .bar{transition:opacity .15s; stroke:rgba(0,0,0,.04); stroke-width:1}
  .chart .bar:hover{opacity:.85}
  .chart .bar.gold{fill:var(--gold)}
  .chart .bar.silver{fill:var(--silver)}
  .chart .bar.bronze{fill:var(--bronze)}
  .chart .bar.mint{fill:var(--mint)}
  .chart .bar.sky{fill:var(--sky)}
  .chart .bar.lilac{fill:var(--lilac)}
  .chart .bar.lavender{fill:var(--lavender)}
  .chart .bar-value{font-size:15px; fill:var(--ink); font-weight:700}
  .chart .bar-label{font-size:13px; fill:var(--ink-2); font-weight:500}
  .chart .donut-center{font-size:30px; font-weight:700; fill:var(--ink)}
  .chart .donut-center-sub{font-size:11px; fill:var(--muted); text-transform:uppercase; letter-spacing:.5px; font-weight:600}
  .donut-wrap{display:flex; gap:18px; align-items:center; flex-wrap:wrap}
  .donut-wrap .chart.donut{flex:0 0 220px; max-width:220px}
  .legend{list-style:none; padding:0; margin:0; flex:1; min-width:160px; font-size:13px; color:var(--ink-2); max-height:240px; overflow:auto}
  .legend li{display:flex; align-items:center; gap:8px; padding:4px 0}
  .legend .dot{width:12px; height:12px; border-radius:4px; flex-shrink:0}
  .legend .legend-name{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .legend .legend-num{color:var(--muted); font-variant-numeric:tabular-nums; font-size:12px; flex-shrink:0}
  .chart-empty{padding:24px 0; text-align:center; color:var(--muted); font-size:13px}
  @media (max-width:640px){
    .donut-wrap{flex-direction:column; align-items:flex-start}
    .donut-wrap .chart.donut{max-width:180px}
  }

  /* Section title */
  h2.section-title, h3.stat-group-title, h3.chart-title{margin:0}
  .section-title{
    display:flex; align-items:baseline; gap:10px; margin:8px 0 12px;
    font-size:14px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.6px;
  }
  .section-title .meta{font-weight:400; text-transform:none; letter-spacing:0; font-size:12px}
  .section-title .section-toggle{margin-left:auto; font-size:12px; padding:4px 10px; text-transform:none; letter-spacing:0}
  .chart-title{margin-bottom:2px}

  /* Event card */
  .event{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    margin-bottom:12px; overflow:hidden; box-shadow:var(--shadow);
  }
  .event-head{
    padding:14px 16px; background:var(--card-soft); border-bottom:1px solid var(--line);
    display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; align-items:center;
  }
  .event-head .left{display:flex; flex-direction:column; gap:4px; min-width:0}
  .event-head .name{font-weight:600; font-size:15px; color:var(--ink)}
  .sqorz-link{color:inherit; text-decoration:none; border-bottom:1px solid transparent; transition:border-color .15s, color .15s}
  .sqorz-link:hover{color:var(--accent-hi); border-bottom-color:color-mix(in srgb,var(--accent) 40%, transparent)}
  .sqorz-link::after{
    content:"↗"; font-size:.75em; margin-left:4px; color:var(--muted);
    transition:color .15s; vertical-align:baseline;
  }
  .sqorz-link:hover::after{color:var(--accent-hi)}
  .event-head .right{display:flex; flex-direction:column; align-items:flex-end; gap:4px}
  .event-head .date{
    font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums;
    background:var(--card); padding:3px 8px; border-radius:99px; border:1px solid var(--line);
  }
  .org-badge{
    display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:500;
    padding:3px 9px; border-radius:99px;
    background:color-mix(in srgb,var(--teal) 16%, transparent);
    color:color-mix(in srgb,var(--teal) 75%, var(--ink));
    border:1px solid color-mix(in srgb,var(--teal) 22%, transparent);
  }
  .event-body{padding:6px 16px 12px}
  .class-line{
    display:flex; gap:14px; padding:10px 0; border-bottom:1px dashed var(--line);
    align-items:center; justify-content:space-between; flex-wrap:wrap;
  }
  .class-line:last-child{border-bottom:none}
  .cl-info{flex:1; min-width:0}
  .class-name{font-weight:600; font-size:14px; color:var(--ink)}
  .meta{font-size:12px; color:var(--muted)}
  .phases{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px}
  .phase{
    background:var(--card-soft); border:1px solid var(--line); padding:3px 9px;
    border-radius:99px; font-size:12px; display:inline-flex; gap:6px; align-items:baseline;
    color:var(--muted);
  }
  .phase b{color:var(--ink); font-weight:600}
  .phase .gate{opacity:.65; font-size:11px}
  .phase.pos-1 b{color:var(--gold)}
  .phase.pos-2 b{color:var(--silver)}
  .phase.pos-3 b{color:var(--bronze)}
  .phase.is-moto{
    background:color-mix(in srgb,var(--lavender) 10%, var(--card-soft));
    border-color:color-mix(in srgb,var(--lavender) 25%, var(--line));
    color:color-mix(in srgb,var(--lavender) 60%, var(--muted));
  }
  .phase.is-final{
    background:color-mix(in srgb,var(--peach) 12%, var(--card-soft));
    border-color:color-mix(in srgb,var(--peach) 30%, var(--line));
    color:color-mix(in srgb,var(--peach) 55%, var(--ink));
    font-weight:500;
  }
  a.phase{text-decoration:none; cursor:pointer; transition:border-color .15s, background .15s, transform .05s; border-color:color-mix(in srgb,var(--accent) 35%, var(--line))}
  a.phase::after{content:'↗'; font-size:10px; opacity:.5; margin-left:1px; line-height:1}
  a.phase:hover{border-color:var(--accent); background:color-mix(in srgb,var(--accent) 10%, transparent)}
  a.phase:hover::after{opacity:1}
  a.phase.is-moto{border-color:color-mix(in srgb,var(--lavender) 45%, var(--line))}
  a.phase.is-moto:hover{border-color:var(--lavender); background:color-mix(in srgb,var(--lavender) 18%, transparent)}
  a.phase.is-final{border-color:color-mix(in srgb,var(--peach) 55%, var(--line))}
  a.phase.is-final:hover{border-color:var(--peach); background:color-mix(in srgb,var(--peach) 20%, transparent)}

  .rank-pill{
    display:inline-flex; align-items:center; justify-content:center;
    min-width:42px; height:42px; border-radius:50%; font-weight:700; font-size:16px;
    background:var(--card-soft); border:2px solid var(--line); color:var(--ink);
    font-variant-numeric:tabular-nums;
  }
  .rank-pill.r1{background:linear-gradient(135deg,#fff2c8,#e8c574); border-color:var(--gold); color:#7a5a18}
  .rank-pill.r2{background:linear-gradient(135deg,#f4f6fa,#cdd2dc); border-color:var(--silver); color:#4a5260}
  .rank-pill.r3{background:linear-gradient(135deg,#f7dcc4,#d4a07c); border-color:var(--bronze); color:#7a4a2a}
  .rank-pill.r8{
    background:linear-gradient(135deg, color-mix(in srgb,var(--teal) 18%, var(--card-soft)), color-mix(in srgb,var(--sky) 22%, var(--card-soft)));
    border-color:var(--teal);
    color:color-mix(in srgb,var(--teal) 75%, var(--ink));
  }
  .cl-right{display:flex; align-items:center; gap:12px}
  .cl-meta-r{display:flex; flex-direction:column; align-items:flex-end; gap:2px; font-size:12px; color:var(--muted)}
  .cl-meta-r .lbl{text-transform:uppercase; letter-spacing:.5px; font-size:10px; font-weight:600}
  .top-pct{
    display:inline-block; font-size:11px; font-weight:600;
    padding:1px 8px; border-radius:99px; margin-top:2px;
    background:color-mix(in srgb,var(--sky) 16%, transparent);
    color:color-mix(in srgb,var(--sky) 70%, var(--ink));
  }
  .top-pct.elite{background:color-mix(in srgb,var(--gold) 24%, transparent); color:#78350f}
  .top-pct.good{background:color-mix(in srgb,var(--good) 22%, transparent); color:#14532d}

  /* Championnats — réutilise .event/.event-head/.event-body, n'ajoute que les spécificités */
  .championship{
    border-left:3px solid var(--gold);
  }
  .org-badges{display:flex; flex-wrap:wrap; gap:4px}
  .championship .event-head{
    background:linear-gradient(180deg, color-mix(in srgb,var(--gold) 14%, var(--card)) 0%, var(--card) 100%);
  }

  /* Ligne de championnat : grille à 2 colonnes sur desktop, 1 col empilée sur mobile */
  .champ-line{
    display:grid;
    grid-template-columns:1fr auto;
    grid-template-areas:
      "category rank"
      "summary  rank"
      "details  details";
    gap:6px 18px;
    padding:4px 0 4px;
    align-items:start;
  }
  .champ-category{grid-area:category; min-width:0; display:flex; flex-direction:column; gap:2px}
  .champ-category .class-name{font-weight:600; font-size:14px; color:var(--ink)}
  .champ-category .meta{font-size:12px; color:var(--muted)}
  .champ-rank{
    grid-area:rank;
    display:flex; flex-direction:row-reverse; align-items:center; gap:12px;
    align-self:start;
  }
  .champ-rank-text{text-align:right}
  .champ-rank-text .lbl{
    display:block;
    text-transform:uppercase; letter-spacing:.5px; font-size:10px; font-weight:600;
    color:var(--muted);
  }
  .champ-rank-sub{font-size:12px; color:var(--muted); margin-top:2px}

  .champ-summary{
    grid-area:summary;
    margin-top:2px; font-size:13px; color:var(--ink-2);
    display:flex; flex-wrap:wrap; align-items:baseline; gap:6px;
  }
  .champ-summary .lbl{
    text-transform:uppercase; letter-spacing:.5px; font-size:10px; font-weight:600;
    color:var(--muted);
  }
  .champ-summary b{font-weight:700; color:var(--ink)}
  .champ-summary .sep{color:var(--line-strong)}
  .champ-summary .muted{color:var(--muted); font-size:12px}

  .champ-details{
    grid-area:details;
    margin-top:8px;
    border:1px solid var(--line); border-radius:10px;
    background:var(--card-soft);
  }
  .champ-details > summary{
    cursor:pointer; padding:8px 12px; font-size:12px; font-weight:600;
    color:var(--ink-2); list-style:none;
    user-select:none;
  }
  .champ-details > summary::-webkit-details-marker{display:none}
  .champ-details > summary::before{
    content:"▸"; display:inline-block; margin-right:6px;
    transition:transform .15s ease;
    color:var(--muted);
  }
  .champ-details[open] > summary::before{transform:rotate(90deg)}
  .champ-details > summary:hover{color:var(--accent-hi)}
  .champ-details[open] .sum-show{display:none}
  .champ-details:not([open]) .sum-hide{display:none}

  .champ-stages{
    width:100%; border-collapse:collapse; font-size:12.5px;
    border-top:1px solid var(--line);
  }
  .champ-stages th, .champ-stages td{
    padding:6px 10px; text-align:left;
    border-bottom:1px solid var(--line);
  }
  .champ-stages th{
    font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.5px;
    color:var(--muted); background:transparent;
  }
  .champ-stages tr:last-child td{border-bottom:none}
  .champ-stages .st-date{color:var(--muted); white-space:nowrap; width:1%}
  .champ-stages .st-name{color:var(--ink)}
  .champ-stages .st-rank{font-weight:600; width:1%; white-space:nowrap}
  .champ-stages .st-pts{width:1%; white-space:nowrap; color:var(--ink-2)}
  .champ-stages .st-tally{width:1%; text-align:center}
  .champ-stages tr.absent td{color:var(--muted); font-style:italic}
  .champ-stages tr.absent .st-name{font-style:normal}
  .champ-stages .muted{color:var(--muted)}
  .special-result{font-size:.85em; font-weight:700; letter-spacing:.04em}
  .phase.dnx{background:#fff1f2; color:#9f1239; border-color:#fecdd3}
  a.phase.dnx,a.phase.dnx:hover{border-color:#fecdd3; background:#fff1f2}
  .phase.dnx b{color:#9f1239}

  .tally{
    display:inline-block; min-width:18px; height:18px; line-height:18px; text-align:center;
    font-size:11px; font-weight:700; border-radius:50%;
  }
  .tally-on{
    background:color-mix(in srgb,var(--good) 35%, transparent);
    color:#14532d;
  }
  .tally-off{
    background:transparent; color:var(--muted);
    border:1px solid var(--line-strong);
  }
  :root.dark .tally-on{color:#bfe6d0}

  /* Sélecteur de pilote (homonymes) */
  .pilot-picker{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 20px; margin-bottom:18px; box-shadow:var(--shadow);
  }
  .pilot-picker-title{
    font-size:12px; font-weight:600; color:var(--muted);
    text-transform:uppercase; letter-spacing:.5px; margin-bottom:12px;
  }
  .pilot-picker-list{
    display:flex; flex-direction:column; gap:8px;
  }
  .pilot-pick-btn{
    display:flex; align-items:center; gap:12px;
    width:100%; text-align:left; background:var(--card-soft);
    border:1.5px solid var(--line); border-radius:12px;
    padding:10px 14px; cursor:pointer; transition:border-color .15s, background .15s;
  }
  .pilot-pick-btn:hover{ border-color:var(--accent); background:var(--accent-soft) }
  .pilot-pick-btn.active{ border-color:var(--accent); background:var(--accent-soft) }
  .ppav{
    width:36px; height:36px; border-radius:50%; flex-shrink:0;
    display:grid; place-items:center;
    font-weight:800; font-size:11px; color:#fff; letter-spacing:.3px;
  }
  .ppinfo{ flex:1; min-width:0 }
  .ppname{ font-size:13px; font-weight:700; color:var(--ink) }
  .ppmeta{ font-size:11.5px; color:var(--muted); margin-top:1px }
  .ppcount{ font-size:11px; font-weight:600; color:var(--muted); white-space:nowrap }
  @media(max-width:640px){
    .pilot-picker{ padding:12px 14px }
    .pilot-pick-btn{ padding:8px 12px; gap:10px }
  }

  /* Carte pilote — Profile Hero Card */
  .pilot-card{
    display:grid;
    grid-template-columns:auto 1fr auto;
    gap:24px; align-items:center;
    padding:28px 32px; margin-bottom:18px;
    background:linear-gradient(135deg,
      var(--card) 0%,
      color-mix(in srgb, var(--pilot-color, var(--accent)) 6%, var(--card)) 60%,
      color-mix(in srgb, var(--pilot-color, var(--accent)) 12%, var(--card)) 100%);
    border:1px solid color-mix(in srgb, var(--pilot-color, var(--accent)) 30%, var(--line));
    border-radius:var(--radius);
    box-shadow:var(--shadow-xl, var(--shadow));
    position:relative; overflow:hidden;
  }
  .pilot-card::before{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(ellipse at 95% 50%,
      color-mix(in srgb, var(--pilot-color, var(--accent)) 10%, transparent),
      transparent 60%);
  }
  .pilot-avatar{
    width:72px; height:72px; border-radius:50%;
    display:grid; place-items:center;
    font-weight:800; font-size:24px; letter-spacing:-.5px;
    color:#fff; flex-shrink:0;
    background:var(--pilot-color, var(--accent));
    box-shadow:0 0 0 3px var(--card), 0 0 0 5px var(--pilot-color, var(--accent)), 0 6px 20px rgba(0,0,0,.22);
    animation:avatar-in .3s ease both;
    position:relative; z-index:1;
  }
  @keyframes avatar-in{
    from{transform:scale(.8); opacity:0}
    to{transform:scale(1); opacity:1}
  }
  .pilot-info{ flex:1; min-width:0; position:relative; z-index:1 }
  .pilot-name{
    font-size:26px; font-weight:800; color:var(--ink);
    line-height:1.1; margin-bottom:10px; letter-spacing:-.6px;
  }
  .pilot-badges{ display:flex; gap:8px; flex-wrap:wrap; align-items:center }
  .pilot-plate{
    font-size:12px; font-weight:700; letter-spacing:.4px;
    padding:4px 12px; border-radius:99px;
    background:var(--pilot-color, var(--accent)); color:#fff;
    font-variant-numeric:tabular-nums;
  }
  .pilot-club{
    font-size:12.5px; font-weight:500; color:var(--ink-2);
    padding:4px 12px; border-radius:99px;
    background:var(--card-soft); border:1px solid var(--line);
    display:inline-flex; align-items:center; gap:5px;
  }
  .pilot-age{
    font-size:12.5px; font-weight:600; color:var(--pilot-color, var(--accent));
    padding:4px 12px; border-radius:99px;
    background:color-mix(in srgb, var(--pilot-color, var(--accent)) 12%, var(--card-soft));
    border:1px solid color-mix(in srgb, var(--pilot-color, var(--accent)) 30%, var(--line));
    display:inline-flex; align-items:center; gap:5px;
  }
  .pilot-qs{
    display:flex; gap:0; flex-shrink:0; position:relative; z-index:1;
    border-left:1px solid var(--line); padding-left:20px;
    align-self:stretch; align-items:center;
  }
  .pilot-qs-item{
    text-align:center; padding:0 16px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .pilot-qs-item:not(:last-child){ border-right:1px solid var(--line) }
  .pilot-qs-item .qv{
    font-size:36px; font-weight:800; color:var(--ink);
    line-height:1; font-variant-numeric:tabular-nums;
    min-width:2ch; display:block;
  }
  .pilot-qs-item .qk{
    font-size:10px; color:var(--muted);
    text-transform:uppercase; letter-spacing:.6px; margin-top:5px;
  }
  @media (max-width:860px){
    .pilot-card{ grid-template-columns:auto 1fr; gap:16px; padding:20px 20px }
    .pilot-qs{
      grid-column:1/-1; border-left:none; padding-left:0;
      border-top:1px solid var(--line); padding-top:14px;
      justify-content:space-around;
    }
    .pilot-qs-item{ padding:0 12px }
    .pilot-qs-item .qv{ font-size:28px }
  }
  @media (max-width:640px){
    .pilot-card{ gap:12px; padding:16px 14px }
    .pilot-avatar{ width:56px; height:56px; font-size:18px }
    .pilot-name{ font-size:20px; margin-bottom:8px }
    .pilot-qs-item .qv{ font-size:22px }
  }

  /* Onglets — visibles sur tous les écrans */
  .tabs-nav{
    display:flex; gap:0; overflow-x:auto; scrollbar-width:none;
    padding:0; margin:0;
    background:color-mix(in srgb, var(--bg) 94%, transparent);
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border-bottom:2px solid var(--line);
  }
  .tabs-nav::-webkit-scrollbar{ display:none }
  .tab-btn{
    flex:0 0 auto; padding:14px 22px;
    background:transparent; border:none;
    border-bottom:3px solid transparent; margin-bottom:-2px;
    color:var(--muted); font-family:inherit; font-weight:500;
    font-size:14px; line-height:1; cursor:pointer;
    white-space:nowrap; transition:color .15s, border-color .2s;
    border-radius:0;
  }
  .tab-btn .tab-badge{
    display:inline-block; font-weight:700; font-size:11px;
    padding:1px 6px; margin-left:6px; border-radius:99px;
    background:color-mix(in srgb, var(--accent) 18%, transparent);
    color:var(--accent-hi); vertical-align:1px;
  }
  .tab-btn:hover{ color:var(--ink) }
  .tab-btn.active{
    color:var(--ink); font-weight:600;
    border-bottom-color:var(--accent);
  }
  .tab-btn[disabled]{ opacity:.35; cursor:default; pointer-events:none }
  .tab-panel{ display:none }
  .tab-panel.active{ display:block }
  .tab-panel > h2.section-title:first-child{ margin-top:4px }

  .empty{padding:36px; text-align:center; color:var(--muted)}
  .summary{font-size:13px; color:var(--muted); margin:0 0 12px}

  /* Responsive mobile */
  @media (max-width:640px){
    .topbar{padding:28px 18px 92px}
    .topbar h1{font-size:24px}
    .topbar p{font-size:13px}
    main{padding:0 16px 24px; margin-top:-60px}
    .card{padding:14px}
    .filters{padding:16px}

    .stats-hero{grid-template-columns:repeat(2, 1fr); gap:10px}
    .stat.stat-hero{padding:14px 16px}
    .stat.stat-hero .v{font-size:26px}
    .stat.stat-hero .sub{font-size:12px}
    .stats{grid-template-columns:repeat(2, 1fr); gap:10px}

    /* Phases : wrap sur plusieurs lignes pour tout voir sans scroll latéral */
    .phases{flex-wrap:wrap; gap:5px}
    .phase{flex-shrink:1; max-width:100%}

    /* Class-line plus compacte */
    .class-line{gap:10px; padding:8px 0}
    .cl-right{gap:8px}
    .rank-pill{min-width:36px; height:36px; font-size:14px}

    /* Event head : col plutôt que row si étroit */
    .event-head .right{align-items:flex-start}

    /* Ligne de championnat : tout empilé, rang en bandeau au-dessus */
    .champ-line{
      grid-template-columns:1fr;
      grid-template-areas:
        "rank"
        "category"
        "summary"
        "details";
      gap:10px;
      padding:8px 0 6px;
    }
    .champ-rank{
      flex-direction:row;
      gap:12px;
      padding:8px 12px;
      background:color-mix(in srgb, var(--gold) 12%, var(--card-soft));
      border:1px solid color-mix(in srgb, var(--gold) 28%, var(--line));
      border-radius:10px;
    }
    .champ-rank-text{text-align:left; flex:1; min-width:0}
    .champ-rank-text .lbl{font-size:11px}
    .champ-rank-sub{font-size:13px; color:var(--ink-2); font-weight:500}
    .champ-summary{font-size:13px}

    /* Manches : layout liste verticale (une ligne par manche, robuste, pas de flex-wrap) */
    .champ-details{min-width:0; max-width:100%; overflow:hidden}
    .champ-details > summary{padding:10px 12px}
    .champ-stages, .champ-stages tbody{
      display:block; border:none;
      width:100%; max-width:100%; box-sizing:border-box;
    }
    .champ-stages thead{display:none}
    .champ-stages tr{
      display:block;
      padding:9px 12px;
      border:none;
      border-top:1px solid var(--line);
      background:transparent;
      width:100%; box-sizing:border-box;
      overflow:hidden;
    }
    .champ-stages tr:first-child{border-top:none}
    .champ-stages td{
      padding:0; border:none;
      font-size:13px;
      width:auto;
    }
    .champ-stages .st-name{
      display:block; width:auto;
      font-weight:600; color:var(--ink);
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
      max-width:100%;
    }
    .champ-stages .st-date{
      display:block; width:auto;
      color:var(--muted); font-size:12px;
      margin-top:1px;
    }
    .champ-stages .st-rank{
      display:inline-block; width:auto; margin-top:4px;
      font-weight:600; color:var(--ink-2);
    }
    .champ-stages .st-rank::before{
      content:"Classement "; font-weight:400; color:var(--muted); font-size:11px;
      text-transform:uppercase; letter-spacing:.4px; margin-right:2px;
    }
    .champ-stages .st-pts{
      display:inline-block; width:auto; margin-top:4px; margin-left:10px;
      color:var(--ink-2);
    }
    .champ-stages .st-pts::before{
      content:"· "; color:var(--line-strong); margin-right:4px;
    }
    .champ-stages .st-tally{
      display:inline-block; width:auto; margin-top:4px; margin-left:10px;
      vertical-align:middle;
    }
    .champ-stages tr.absent{opacity:.55}
    .champ-stages tr.absent .st-rank::before{content:"DNS "; font-style:normal; color:var(--muted)}
    .champ-stages tr.absent .st-rank > *,
    .champ-stages tr.absent .st-pts,
    .champ-stages tr.absent .st-tally{display:none}

    .champ-summary{font-size:12px}

    /* Onglets mobiles — ajustements de taille uniquement */
    .tabs-nav{
      margin:0 -14px 16px; padding:0 4px;
      border-radius:0;
    }
    .tab-btn{
      padding:10px 12px; font-size:12.5px;
    }
  }
  @media (max-width:380px){
    .stats-hero{grid-template-columns:1fr}
    .stats{grid-template-columns:1fr}
  }

  /* Comparaison de pilotes */
  .compare-section{
    padding:14px 0 4px;
    border-top:1px solid var(--line);
    margin-top:12px;
  }
  .compare-section-hd{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:14px;
  }
  .compare-section-hd span{
    font-size:12px; font-weight:600; color:var(--muted);
    text-transform:uppercase; letter-spacing:.5px;
  }
  .compare-close-btn{
    background:none; border:none; color:var(--muted); cursor:pointer;
    font-size:16px; padding:3px 8px; border-radius:6px; line-height:1;
  }
  .compare-close-btn:hover{color:var(--bad); background:color-mix(in srgb,var(--bad) 10%, transparent)}
  .compare-pilots{
    display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px;
  }
  @media(max-width:520px){.compare-pilots{grid-template-columns:1fr}}
  .compare-pilot{
    display:flex; align-items:center; gap:10px; padding:10px 12px;
    background:var(--card-soft); border-radius:10px; border:1px solid var(--line);
  }
  .cav{
    width:42px; height:42px; border-radius:50%; flex-shrink:0;
    background:var(--cp-color, var(--accent)); color:#fff;
    display:grid; place-items:center; font-weight:800; font-size:12px; letter-spacing:.3px;
  }
  .cpname{font-weight:700; font-size:13px; color:var(--ink); line-height:1.2}
  .cpsub{font-size:11px; color:var(--muted); margin-top:2px}
  .compare-rows{display:flex; flex-direction:column; gap:5px}
  .compare-row{display:grid; grid-template-columns:52px 1fr 52px; gap:8px; align-items:center}
  .cv{font-size:13px; font-weight:700; color:var(--ink-2); font-variant-numeric:tabular-nums}
  .cv.p1{text-align:right}
  .cv.p2{text-align:left}
  .cv.better{color:var(--ink)}
  .cbar-wrap{
    position:relative; height:20px; border-radius:99px;
    background:var(--card-soft); border:1px solid var(--line); overflow:hidden;
    display:flex; align-items:center; justify-content:center;
  }
  .cbar-p1{
    position:absolute; right:50%; top:0; bottom:0; border-radius:99px;
    background:var(--cp1, var(--teal)); opacity:.65;
  }
  .cbar-p2{
    position:absolute; left:50%; top:0; bottom:0; border-radius:99px;
    background:var(--cp2, var(--berry)); opacity:.65;
  }
  .clabel{
    position:relative; z-index:1; font-size:10px; font-weight:600;
    color:var(--muted); text-transform:uppercase; letter-spacing:.4px; white-space:nowrap;
  }
  @media(max-width:640px){

<body>
<div class="topbar">

            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
        </span>
        Sqorz Head to Head
      </div>
      <button type="button" id="themeBtn" class="theme-btn" aria-label="Changer le thème" title="Changer le thème (auto / clair / sombre)"></button>

<main>
  <!-- Carte chargement / statut -->
  <div class="card" id="statusCard" style="padding:18px">
    <div class="status loading" id="statusEl">Chargement des données…</div>
  </div>

  <!-- Sélection des pilotes -->
  <div class="card" id="selectionCard" hidden>
    <div id="pilotGridWrap" style="padding:20px">
      <div style="display:grid; grid-template-columns:1fr auto 1fr; gap:16px; align-items:end" id="pilotGrid">
        <!-- Pilote A -->
        <div>
          <label for="inputA" style="font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:6px">Pilote A</label>
          <div class="autocomplete-wrap" id="wrapA">
            <input id="inputA" class="control" style="width:100%" type="text" placeholder="Nom du pilote…" autocomplete="off">
            <div class="autocomplete-dropdown" id="dropdownA"></div>

        </div>

        <!-- VS + Inverser -->
        <div style="display:flex;flex-direction:column;align-items:center;gap:6px;padding-bottom:2px">
          <span style="font-size:15px;font-weight:900;color:var(--muted);letter-spacing:1px">VS</span>
          <button type="button" class="invert-btn" id="invertBtn" disabled title="Inverser A et B" aria-label="Inverser les pilotes A et B">⇄</button>

          <label for="inputB" style="font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:6px">Pilote B</label>
          <div class="autocomplete-wrap" id="wrapB">

            <div class="autocomplete-dropdown" id="dropdownB"></div>

        Adversaires fréquents
        <span class="meta" id="suggestionsSubtitle"></span>
      </div>
      <div class="suggestions-list" id="suggestionsList"></div>
    </div>

  <!-- Résultats H2H -->
  <div id="h2hResults"></div>

<script>
(() => {
'use strict';

const INDEX_URL = 'https://raw.githubusercontent.com/LudSoc/sqorz-stats/main/pilots-index.json';
const SQORZ_STATS_BASE = window.location.protocol === 'file:'
  ? '../sqorz_stats/index.html'
  : 'https://ludsoc.github.io/sqorz-stats/';

// ── Utilitaires ──────────────────────────────────
const norm = s => (s || '')
  .toString()
  .normalize('NFD').replace(/[̀-ͯ]/g, '')
  .toLowerCase()
  .replace(/[^a-z0-9 ]+/g, ' ')
  .trim()
  .replace(/\s+/g, ' ');

const escape = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])
);

function findPilotByNormKey(key) {
  if (!pilotsIndex || !key) return null;
  const seen = new Map();
  for (const ev of (pilotsIndex.events || [])) {
    for (const cls of (ev.classes || [])) {
      for (const c of (cls.competitors || [])) {
        const k = norm((c.firstName || '') + ' ' + (c.lastName || '')).trim();
        if (k === key && !seen.has(k)) {
          seen.set(k, { firstName: c.firstName || '', lastName: c.lastName || '', groupName: c.groupName || '', age: c.age ?? null, normKey: k });
        }
      }
    }
  }
  return seen.get(key) ?? null;
}

function parseUrlState() {
  const p = new URLSearchParams(location.search);
  return { a: p.get('a') || '', b: p.get('b') || '' };
}
function buildUrl() {
  const u = new URL(location.href);
  if (pilotA?.normKey) u.searchParams.set('a', pilotA.normKey);
  else u.searchParams.delete('a');
  if (pilotB?.normKey) u.searchParams.set('b', pilotB.normKey);
  else u.searchParams.delete('b');
  return u.pathname + (u.search || '');
}
function pushUrlState() {
  const newUrl = buildUrl();
  const cur = location.pathname + location.search;
  if (newUrl === cur) history.replaceState(null, '', newUrl);
  else history.pushState(null, '', newUrl);
}
function replaceUrlState() {
  history.replaceState(null, '', buildUrl());
}

window.addEventListener('popstate', () => {
  const { a, b } = parseUrlState();
  if (a) {
    const pA = findPilotByNormKey(a);
    if (pA && (!pilotA || pilotA.normKey !== pA.normKey)) {
      // Reset both then re-select from URL
      pilotA = null; pilotB = null;
      inputA.value = ''; inputA.hidden = false; badgeA.hidden = true; badgeA.innerHTML = '';
      inputB.value = ''; inputB.hidden = false; badgeB.hidden = true; badgeB.innerHTML = '';
      inputB.disabled = true; invertBtn.disabled = true;
      h2hResults.innerHTML = '';
      document.body.classList.remove('has-results');
      selectPilotA(pA);
      if (b) {
        const pB = findPilotByNormKey(b);
        if (pB) {
          selectPilotB(pB);
          history.replaceState(null, '', buildUrl());
        }
      }
    }
  } else {
    // Back to empty state
    pilotA = null; pilotB = null;
    inputA.value = ''; inputA.hidden = false; badgeA.hidden = true; badgeA.innerHTML = '';
    inputB.value = ''; inputB.hidden = false; badgeB.hidden = true; badgeB.innerHTML = '';
    inputB.disabled = true; invertBtn.disabled = true;
    h2hResults.innerHTML = '';
    suggestionsSection.hidden = true;
    document.title = 'Sqorz Head to Head';
    document.body.classList.remove('has-results');
  }
});

function humanError(e) {
  if (!e) return 'Erreur inconnue.';
  if (e.name === 'AbortError') return 'Annulé.';
  const msg = e.message || String(e);
  if (/HTTP 5\d\d/.test(msg)) return 'Service momentanément indisponible.';
  if (/HTTP 4\d\d/.test(msg)) return 'Requête refusée.';
  if (/network|fetch failed|Failed to fetch|NetworkError/i.test(msg)) return 'Pas de réseau. Vérifie ta connexion.';
  return msg;
}

function specialLabel(r) {
  if (r == null || r < 100000) return null;
  if (r >= 103000) return 'DSQ';
  if (r >= 101000) return 'DNS';
  return 'DNF';
}

// ── Expansion de l'index (format compact → complet) ─
function expandIndex(idx) {
  for (const ev of (idx.events || [])) {
    for (const cls of (ev.classes || [])) {
      for (const c of (cls.competitors || [])) {
        c.firstName = c.fn; c.lastName = c.ln; c.groupName = c.gn; c.age = c.age ?? null;
      }
    }
  }
  return idx;
}

// ── Chargement ───────────────────────────────────
async function loadIndex() {
  statusEl.className = 'status loading';
  statusEl.textContent = 'Chargement des données…';
  statusCard.hidden = false;
  selectionCard.hidden = true;
  try {
    const res = await fetch(INDEX_URL);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    pilotsIndex = expandIndex(await res.json());
    statusCard.hidden = true;
    selectionCard.hidden = false;
    inputA.focus();
  } catch (e) {
    statusEl.className = 'status error';
    statusEl.textContent = 'Impossible de charger les données : ' + humanError(e);
  }
}

// ── 3.1 Recherche de pilotes ─────────────────────
function searchPilots(query, excludeNormKey = null) {
  if (!pilotsIndex || !norm(query)) return [];
  const tokens = norm(query).split(' ').filter(Boolean);
  const map = new Map();
  for (const ev of (pilotsIndex.events || [])) {
    for (const cls of (ev.classes || [])) {
      for (const c of (cls.competitors || [])) {
        const key = norm((c.firstName || '') + ' ' + (c.lastName || '')).trim();
        if (!key) continue;
        if (excludeNormKey && key === excludeNormKey) continue;
        if (!tokens.every(t => key.includes(t))) continue;
        if (!map.has(key)) {
          map.set(key, { firstName: c.firstName || '', lastName: c.lastName || '', groupName: c.groupName || '', age: c.age ?? null, normKey: key, eventCount: 0 });
        }
        map.get(key).eventCount++;
      }
    }
  }
  return [...map.values()]
    .sort((a, b) => b.eventCount - a.eventCount)
    .slice(0, 12);
}

// ── 3.2 Autocomplete ─────────────────────────────
function setupAutocomplete(input, dropdown, onSelect, getExcludeKey) {
  let focusedIdx = -1;

  function updateDropdown(items) {
    focusedIdx = -1;
    if (!items.length) { dropdown.classList.remove('open'); dropdown.innerHTML = ''; return; }
    dropdown.innerHTML = items.map((p, i) =>
      `<div class="ac-item" data-idx="${i}" tabindex="-1">
        <span class="ac-name">${escape(p.firstName + ' ' + p.lastName)}${p.age != null ? `<span style="font-size:11px;font-weight:400;color:var(--muted);margin-left:6px">${p.age} ans</span>` : ''}</span>
        ${p.groupName ? `<span class="ac-meta">${escape(p.groupName)}</span>` : ''}
      </div>`
    ).join('');
    dropdown.classList.add('open');
    dropdown._items = items;
    dropdown.querySelectorAll('.ac-item').forEach((el, i) => {
      el.addEventListener('mousedown', e => { e.preventDefault(); onSelect(items[i]); closeDropdown(); });
    });
  }

  function closeDropdown() { dropdown.classList.remove('open'); dropdown.innerHTML = ''; focusedIdx = -1; }

  function moveFocus(delta) {
    const items = dropdown.querySelectorAll('.ac-item');
    if (!items.length) return;
    items[focusedIdx]?.classList.remove('focused');
    focusedIdx = (focusedIdx + delta + items.length) % items.length;
    items[focusedIdx]?.classList.add('focused');
    items[focusedIdx]?.scrollIntoView({ block:'nearest' });
  }

  input.addEventListener('input', () => {
    const results = searchPilots(input.value, getExcludeKey());
    if (results.length === 1) {
      onSelect(results[0]);
      closeDropdown();
    } else {
      updateDropdown(results);
    }
  });

  input.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); moveFocus(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); moveFocus(-1); }
    else if (e.key === 'Enter') {
      const focused = dropdown.querySelector('.ac-item.focused') || dropdown.querySelector('.ac-item');
      if (focused) {
        const idx = +focused.dataset.idx;
        onSelect(dropdown._items[idx]);
        closeDropdown();
        e.preventDefault();
      }
    }
    else if (e.key === 'Escape') closeDropdown();
  });

  document.addEventListener('click', e => {
    if (!input.contains(e.target) && !dropdown.contains(e.target)) closeDropdown();
  });
}

// ── Task 4: Compute top opponents et render suggestions ─────
function computeTopOpponents(pilot, maxN = 10) {
  if (!pilotsIndex || !pilot) return [];
  const pilotKey = pilot.normKey;
  const opponents = new Map();

  for (const ev of (pilotsIndex.events || [])) {
    for (const cls of (ev.classes || [])) {
      const pilotEntry = cls.competitors.find(c =>
        norm((c.firstName || '') + ' ' + (c.lastName || '')).trim() === pilotKey
      );
      if (!pilotEntry) continue;
      const pilotRank = typeof pilotEntry.rank === 'number' ? pilotEntry.rank : null;

      for (const c of cls.competitors) {
        const oppKey = norm((c.firstName || '') + ' ' + (c.lastName || '')).trim();
        if (!oppKey || oppKey === pilotKey) continue;

        const confrontationKey = ev.event.eventId + '|' + cls.perpetualClassCode;
        if (!opponents.has(oppKey)) {
          opponents.set(oppKey, {
            firstName: c.firstName || '',
            lastName: c.lastName || '',
            normKey: oppKey,
            groupName: c.groupName || '',
            age: c.age ?? null,
            eventKeys: new Set(),
            winsA: 0, winsB: 0,
          });
        }
        const opp = opponents.get(oppKey);
        if (opp.eventKeys.has(confrontationKey)) continue;
        opp.eventKeys.add(confrontationKey);

        const oppRank = typeof c.rank === 'number' ? c.rank : null;
        if (pilotRank != null && pilotRank < 100000 && oppRank != null && oppRank < 100000) {
          if (pilotRank < oppRank) opp.winsA++;
          else if (oppRank < pilotRank) opp.winsB++;
        }
      }
    }
  }

  return [...opponents.values()]
    .sort((a, b) => b.eventKeys.size - a.eventKeys.size)
    .slice(0, maxN)
    .map(o => ({ ...o, commonEvents: o.eventKeys.size }));
}

function renderSuggestions(opponents) {
  if (!opponents.length) {
    suggestionsList.innerHTML = '<div class="empty-state" style="padding:16px 0"><div class="es-text">Aucun adversaire trouvé pour ce pilote.</div></div>';
    return;
  }
  suggestionsList.innerHTML = opponents.map(opp => {
    const name = escape(opp.firstName + ' ' + opp.lastName);
    const meta = [opp.groupName, opp.age != null ? `${opp.age} ans` : null].filter(Boolean).map(escape).join(' · ');
    const score = `${opp.winsA} – ${opp.winsB}`;
    return `<div class="suggestion-item" role="button" tabindex="0" data-norm-key="${escape(opp.normKey)}">
      <div style="flex:1;min-width:0">
        <div class="si-name">${name}</div>
        ${meta ? `<div class="si-meta">${meta}</div>` : ''}
      </div>
      <div class="si-score">
        <div class="si-badge">${opp.commonEvents} événement(s)</div>
        <div style="margin-top:3px;font-size:11px;color:var(--muted)">${score}</div>
      </div>
    </div>`;
  }).join('');

  suggestionsList.querySelectorAll('.suggestion-item').forEach((el, i) => {
    const handler = () => selectPilotB(opponents[i]);
    el.addEventListener('click', handler);
    el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); handler(); } });
  });
}

// ── Stubs des fonctions à venir (Tasks 3–8) ─────
function onPilotASelected() {
  const opponents = computeTopOpponents(pilotA);
  suggestionsSubtitle.textContent = `${opponents.length} adversaire(s) fréquent(s)`;
  suggestionsSection.hidden = false;
  renderSuggestions(opponents);
}

function computeConfrontations(pilotA, pilotB) {
  if (!pilotsIndex || !pilotA || !pilotB) return [];
  const keyA = pilotA.normKey;
  const keyB = pilotB.normKey;
  const result = [];

  for (const ev of (pilotsIndex.events || [])) {
    for (const cls of (ev.classes || [])) {
      const entryA = cls.competitors.find(c =>
        norm((c.firstName || '') + ' ' + (c.lastName || '')).trim() === keyA
      );
      const entryB = cls.competitors.find(c =>
        norm((c.firstName || '') + ' ' + (c.lastName || '')).trim() === keyB
      );
      if (!entryA || !entryB) continue;
      if (typeof entryA.rank !== 'number' || typeof entryB.rank !== 'number') continue;

      result.push({
        event: ev.event,
        account: ev.account,
        cls: { className: cls.className, perpetualClassCode: cls.perpetualClassCode },
        rankA: entryA.rank,
        rankB: entryB.rank,
      });
    }
  }

  return result.sort((a, b) => (b.event.eventDate || '').localeCompare(a.event.eventDate || ''));
}

function computeH2HStats(confrontations) {
  let winsA = 0, winsB = 0, ties = 0, validCount = 0;
  const categories = new Set();
  let firstDate = '', lastDate = '';

  for (const c of confrontations) {
    const dateStr = c.event.eventDate || '';
    if (dateStr) {
      if (!firstDate || dateStr < firstDate) firstDate = dateStr;
      if (!lastDate || dateStr > lastDate) lastDate = dateStr;
    }
    categories.add(c.cls.className || c.cls.perpetualClassCode || '?');

    const specA = specialLabel(c.rankA);
    const specB = specialLabel(c.rankB);
    if (specA || specB) continue;
    validCount++;
    if (c.rankA < c.rankB) winsA++;
    else if (c.rankB < c.rankA) winsB++;
    else ties++;
  }

  return { winsA, winsB, ties, validCount, total: confrontations.length, categories: [...categories], firstDate, lastDate };
}

function fmtDate(iso) {
  if (!iso) return '—';
  const [y, m, d] = iso.slice(0, 10).split('-');
  return `${d}/${m}/${y}`;
}

function renderH2HHeader(stats) {
  const aLeads = stats.winsA > stats.winsB;
  const bLeads = stats.winsB > stats.winsA;
  const nameA = escape(pilotA.firstName + ' ' + pilotA.lastName);
  const nameB = escape(pilotB.firstName + ' ' + pilotB.lastName);
  const metaA = [pilotA.groupName, pilotA.age != null ? `${pilotA.age} ans` : null].filter(Boolean).map(escape).join(' · ');
  const metaB = [pilotB.groupName, pilotB.age != null ? `${pilotB.age} ans` : null].filter(Boolean).map(escape).join(' · ');
  const clubA = metaA ? `<div class="hp-club">${metaA}</div>` : '';
  const clubB = metaB ? `<div class="hp-club">${metaB}</div>` : '';
  const period = stats.firstDate
    ? `${fmtDate(stats.firstDate)} → ${fmtDate(stats.lastDate)}`
    : '—';

  return `<div class="h2h-header">
    <div class="h2h-pilot">
      <div class="hp-name"><a class="sqorz-link" href="${SQORZ_STATS_BASE}?name=${encodeURIComponent(pilotA.firstName + ' ' + pilotA.lastName)}" target="_blank">${nameA}</a></div>
      ${clubA}
      <div class="hp-wins${aLeads?' leader':''}">${stats.winsA}</div>
      <div style="font-size:12px;color:var(--muted)">victoire(s)</div>
    </div>
    <div class="h2h-vs">
      <div class="vs-label">VS</div>
      <div class="vs-sub">${stats.total} confrontation(s)<br>${period}</div>
    </div>
    <div class="h2h-pilot right">
      <div class="hp-name"><a class="sqorz-link" href="${SQORZ_STATS_BASE}?name=${encodeURIComponent(pilotB.firstName + ' ' + pilotB.lastName)}" target="_blank">${nameB}</a></div>
      ${clubB}
      <div class="hp-wins${bLeads?' leader':''}">${stats.winsB}</div>
      <div style="font-size:12px;color:var(--muted)">victoire(s)</div>
    </div>
  </div>`;
}

function renderH2HStatsCards(stats) {
  const tiesHtml = stats.ties > 0
    ? `<div class="stat teal"><div class="k">Égalités</div><div class="v">${stats.ties}</div></div>` : '';

  return `<div class="stats" style="margin:16px 18px">
    <div class="stat sky"><div class="k">Confrontations</div><div class="v">${stats.total}</div><div class="sub">${stats.validCount} avec classements valides</div></div>
    <div class="stat good"><div class="k">Victoires A</div><div class="v">${stats.winsA}</div></div>
    <div class="stat rose"><div class="k">Victoires B</div><div class="v">${stats.winsB}</div></div>
    ${tiesHtml}
  </div>`;
}

function renderH2HTable(confrontations) {
  if (!confrontations.length) return '';
  const nameA = escape(pilotA.firstName + ' ' + pilotA.lastName);
  const nameB = escape(pilotB.firstName + ' ' + pilotB.lastName);

  const rows = confrontations.map(c => {
    const specA = specialLabel(c.rankA);
    const specB = specialLabel(c.rankB);
    const isDnx = specA || specB;

    const rankACellContent = specA
      ? `<span class="special-result" style="font-size:.85em;font-weight:700">${specA}</span>`
      : (c.rankA === 1 ? '🥇' : c.rankA === 2 ? '🥈' : c.rankA === 3 ? '🥉' : `${c.rankA}e`);
    const rankBCellContent = specB
      ? `<span class="special-result" style="font-size:.85em;font-weight:700">${specB}</span>`
      : (c.rankB === 1 ? '🥇' : c.rankB === 2 ? '🥈' : c.rankB === 3 ? '🥉' : `${c.rankB}e`);

    const aWins = !isDnx && c.rankA < c.rankB;
    const bWins = !isDnx && c.rankB < c.rankA;
    const winIcon = isDnx ? '' : aWins ? '← 🏆' : bWins ? '🏆 →' : '=';

    const eventHref = c.account?.accountCode
      ? `https://our.sqorz.com/org/${encodeURIComponent(c.account.accountCode)}/event/${encodeURIComponent(c.event.eventId)}${c.cls.perpetualClassCode ? '/class/' + encodeURIComponent(c.cls.perpetualClassCode) : ''}`
      : null;
    const eventName = eventHref
      ? `<a class="sqorz-link" href="${eventHref}" target="_blank" rel="noopener">${escape(c.event.eventName || c.event.eventId)}</a>`
      : escape(c.event.eventName || c.event.eventId);

    return `<tr class="${isDnx ? 'dnx-row' : ''}">
      <td class="ev-date">${fmtDate(c.event.eventDate)}</td>
      <td class="ev-name">${eventName}</td>
      <td class="ev-cat">${escape(c.cls.className || c.cls.perpetualClassCode || '')}</td>
      <td class="rank-a${aWins?' winner':''}">${rankACellContent}</td>
      <td class="rank-b${bWins?' winner':''}">${rankBCellContent}</td>
      <td class="win-icon">${winIcon}</td>
    </tr>`;
  }).join('');

  return `<div style="overflow-x:auto;padding:0 18px 18px">
    <table class="h2h-table">
      <thead>
        <tr>
          <th>Date</th>
          <th>Événement</th>
          <th>Catégorie</th>
          <th>${nameA}</th>
          <th>${nameB}</th>
          <th></th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

function renderCatFilter(categories, activeCat) {
  if (categories.length <= 1) return '';
  const pills = [''].concat(categories).map(cat => {
    const label = cat === '' ? 'Toutes' : escape(cat);
    const isActive = cat === activeCat;
    return `<button type="button" class="cat-pill${isActive?' active':''}" data-cat="${escape(cat)}">${label}</button>`;
  }).join('');
  return `<div class="cat-filter-row" id="catFilterRow">${pills}</div>`;
}

let allConfrontations = [];
let activeCat = '';

function computeAndRenderH2H() {
  allConfrontations = computeConfrontations(pilotA, pilotB);
  activeCat = '';

  if (!allConfrontations.length) {
    const keyA = pilotA.normKey, keyB = pilotB.normKey;
    let hasCommonEvent = false;
    for (const ev of (pilotsIndex.events || [])) {
      let hasA = false, hasB = false;
      for (const cls of ev.classes) {
        for (const c of cls.competitors) {
          const k = norm((c.firstName||'') + ' ' + (c.lastName||'')).trim();
          if (k === keyA) hasA = true;
          if (k === keyB) hasB = true;
        }
      }
      if (hasA && hasB) { hasCommonEvent = true; break; }
    }
    if (hasCommonEvent) {
      h2hResults.innerHTML = `<div class="card"><div class="empty-state">
        <div class="es-icon">📋</div>
        <div class="es-title">Pas de confrontation dans la même catégorie</div>
        <div class="es-text">Ces pilotes ont participé aux mêmes événements mais jamais dans la même catégorie.</div>
      </div></div>`;
    } else {
      h2hResults.innerHTML = `<div class="card"><div class="empty-state">
        <div class="es-icon">🏁</div>
        <div class="es-title">Aucune confrontation directe</div>
        <div class="es-text">Ces deux pilotes n'ont jamais été classés dans la même catégorie lors du même événement.</div>
      </div></div>`;
    }
    return;
  }

  renderH2H();
  document.title = `${pilotA.firstName} ${pilotA.lastName} vs ${pilotB.firstName} ${pilotB.lastName} — Sqorz Stats`;
  setTimeout(() => {
    const topbarH = document.querySelector('.topbar')?.offsetHeight || 0;
    const y = h2hResults.getBoundingClientRect().top + window.scrollY - topbarH - 12;
    window.scrollTo({ top: y, behavior: 'smooth' });
  }, 50);
}

function renderH2H() {
  document.body.classList.add('has-results');
  const filtered = activeCat
    ? allConfrontations.filter(c => (c.cls.className || c.cls.perpetualClassCode) === activeCat)
    : allConfrontations;

  const stats = computeH2HStats(filtered);
  const allStats = computeH2HStats(allConfrontations);
  const catFilter = renderCatFilter(allStats.categories, activeCat);
  const header = renderH2HHeader(stats);
  const statsCards = renderH2HStatsCards(stats);
  const table = renderH2HTable(filtered);

  h2hResults.innerHTML = `<div class="card" style="padding:0;overflow:hidden">
    ${header}
    ${catFilter}
    ${statsCards}
    <div class="section-title" style="padding:0 18px;margin-bottom:0">
      Détail des confrontations
      <span class="meta">${filtered.length} résultat(s)</span>
    </div>
    ${table}
  </div>`;

  document.getElementById('catFilterRow')?.querySelectorAll('.cat-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      activeCat = btn.dataset.cat;
      renderH2H();
    });
  });
}

  const pA = findPilotByNormKey(a);

<script>
(() => {
  const btn = document.getElementById('themeBtn');
  function getTheme() { return localStorage.getItem('theme') || 'auto'; }
  function applyTheme(pref) {
    const icons = { auto:'🌓', light:'☀️', dark:'🌙' };
    btn.textContent = icons[pref] || icons.auto;
    btn.title = `Thème : ${pref}`;
    const isDark = pref === 'dark' || (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.classList.toggle('dark', isDark);
    if (pref === 'auto') localStorage.removeItem('theme');
    else document.documentElement.dataset.themePref = pref;
  }
  btn.addEventListener('click', () => {
    const order = ['auto','light','dark'];
    const next = order[(order.indexOf(getTheme()) + 1) % 3];
    localStorage.setItem('theme', next);
    if (next === 'auto') localStorage.removeItem('theme');
    applyTheme(next);
  });
  applyTheme(getTheme());
})();
</script>
